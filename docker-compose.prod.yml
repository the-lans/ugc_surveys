services:
  db:
    image: postgres:16-alpine
    restart: always
    # Параметры рассчитаны на сервер с ~2 GB RAM.
    # max_connections=200 — запас для воркеров + админки + мониторинга.
    # shared_buffers=256MB — ~25% RAM, основной кэш PostgreSQL.
    # effective_cache_size=512MB — подсказка планировщику об объёме доступного кэша ОС.
    # work_mem=4MB — память на одну операцию сортировки/хэширования.
    # checkpoint_completion_target=0.9 — размазывает запись checkpoint по времени, снижает пики I/O.
    # random_page_cost=1.1 — подходит для SSD (дефолт 4.0 рассчитан на HDD).
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c work_mem=4MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
    environment:
      POSTGRES_DB: ugc_surveys
      POSTGRES_USER: django
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U django -d ugc_surveys"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: always
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DATABASE_URL: postgres://django:${DB_PASSWORD}@db:5432/ugc_surveys
      DJANGO_SECURE_SSL_REDIRECT: "False"
      DB_HOST: db
    volumes:
      - static_files:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/app/staticfiles:ro
      - ./frontend:/frontend:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_files:
