# worker_processes auto — один воркер на каждое ядро CPU.
# Дефолт в nginx-alpine равен 1, что не использует остальные ядра.
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    # На каждый воркер — до 1024 одновременных соединений.
    worker_connections 1024;
    # Принимаем несколько соединений за одну итерацию event loop.
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # sendfile + tcp_nopush — отправка файлов через ядро без копирования в user space.
    # tcp_nodelay — отключает алгоритм Нейгла для keep-alive соединений.
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    upstream gunicorn {
        server web:8000;
        # Переиспользуем TCP-соединения к gunicorn вместо новых на каждый запрос.
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 10M;

        gzip on;
        gzip_types application/json text/plain;

        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # API и Swagger — проксируем в Django
        location /api/ {
            proxy_pass http://gunicorn;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Фронтенд — отдаём статику из frontend/
        location / {
            root /frontend;
            try_files $uri $uri.html $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
